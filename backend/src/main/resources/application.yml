spring:
  application:
    name: code2career
  datasource:
    url: ${DB_URL:jdbc:h2:mem:careeros;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:password}
    driver-class-name: ${DB_DRIVER_CLASS_NAME:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:true}
      path: /h2-console

server:
  port: ${SERVER_PORT:8080}

jwt:
  secret: ${JWT_SECRET:bmV0ZS1zZWNyZXQta2V5LTEyLWJ5dGVzLTEyLWJ5dGVzLTEyLWJ5dGVz}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

aws:
  region: ${AWS_REGION:us-east-1}
  ses:
    enabled: ${AWS_SES_ENABLED:false}
    from-email: ${AWS_SES_FROM_EMAIL:}
  s3:
    enabled: ${AWS_S3_ENABLED:false}
    bucket: ${AWS_S3_BUCKET:}

integrations:
  ats:
    url: ${ATS_PROVIDER_URL:}
  jobs:
    url: ${JOBS_PROVIDER_URL:}
  whatsapp:
    api-url: ${WHATSAPP_API_URL:}
    token: ${WHATSAPP_TOKEN:}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    reminders-enabled: ${WHATSAPP_REMINDERS_ENABLED:false}
    reminder-interval-ms: ${WHATSAPP_REMINDER_INTERVAL_MS:3600000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
